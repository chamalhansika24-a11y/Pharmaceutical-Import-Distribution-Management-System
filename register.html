<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GreenCare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Fixed Width Container with Top-Level Alignment */
        .register-container { 
            max-width: 500px; 
            width: 100%;
            background: #f5f7f5; 
            padding: 40px; 
            border-radius: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            position: relative;
            overflow: hidden;
        }

        /* Decorative Brand Accents */
        .register-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: #87EE62;
        }

        h2 { 
            color: #333; 
            text-align: left; 
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: bold;
            border-left: 5px solid #87EE62;
            padding-left: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-top: 10px;
            display: block;
        }

        /* Input Shadows and Style */
        input, select { 
            width: 100%; 
            padding: 12px 15px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 20px; 
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #87EE62;
            box-shadow: 0 4px 12px rgba(135, 238, 98, 0.2);
        }

        /* Dynamic Section Styling */
        .dynamic-section { 
            background: rgba(135, 238, 98, 0.1); 
            padding: 20px; 
            border-radius: 20px; 
            margin-top: 15px; 
            border: 1px dashed #87EE62;
        }

        .dynamic-section h4 {
            margin-bottom: 10px;
            color: #1a5c1a;
            font-size: 15px;
        }

        .hidden { display: none !important; }

        /* Button with Fading Gradient and Shadow */
        button { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(to right, #87EE62, rgba(135, 238, 98, 0.3)); 
            color: #1a5c1a; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            margin-top: 20px;
        }

        button:hover { 
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        p {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        p a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Client Registration</h2>
        <form id="registerForm">
            <input type="text" id="r_username" placeholder="Username" required>
            <input type="password" id="r_password" placeholder="Password" required>
            <input type="email" id="r_email" placeholder="Email Address" required>
            <input type="text" id="r_phone" placeholder="Phone Number" required>
            
            <label>Address Details</label>
            <input type="text" id="r_bno" placeholder="Building No" required>
            <input type="text" id="r_street" placeholder="Street" required>
            <input type="text" id="r_city" placeholder="City" required>

            <label>Select Client Type</label>
            <select id="r_type" onchange="toggleFields()" required>
                <option value="">-- Select --</option>
                <option value="Hospital">Hospital</option>
                <option value="Pharmacy">Pharmacy</option>
            </select>

            <div id="hospitalFields" class="hidden dynamic-section">
                <h4>Hospital Details</h4>
                <input type="text" id="r_hname" placeholder="Hospital Name">
                <input type="text" id="r_branch" placeholder="Branch Name">
                <input type="text" id="r_director" placeholder="Director Name">
                <input type="number" id="r_wards" placeholder="Ward Count">
            </div>

            <div id="pharmacyFields" class="hidden dynamic-section">
                <h4>Pharmacy Details</h4>
                <input type="text" id="r_pname" placeholder="Pharmacy Name">
                <input type="text" id="r_regno" placeholder="Pharmacist Reg No">
            </div>

            <button type="submit">Register Now</button>
        </form>
        <p>
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>

    <script src="register.js"></script>
    <script>
        /* Keeping local copy of function to ensure preview works */
        function toggleFields() {
            var type = document.getElementById('r_type').value;
            var hFields = document.getElementById('hospitalFields');
            var pFields = document.getElementById('pharmacyFields');

            if (type === 'Hospital') {
                hFields.classList.remove('hidden');
                pFields.classList.add('hidden');
            } else if (type === 'Pharmacy') {
                hFields.classList.add('hidden');
                pFields.classList.remove('hidden');
            } else {
                hFields.classList.add('hidden');
                hFields.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
