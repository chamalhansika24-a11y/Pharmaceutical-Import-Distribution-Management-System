<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GreenCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Italino&display=swap" rel="stylesheet">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Fixed 480x400 Container */
        .login-popup {
            width: 480px;
            height: 400px;
            background-color: #E2E2E2;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Top and Bottom Banners */
        .wave {
            width: 100%;
            height: 50px;
            background-color: #87EE62;
            position: absolute;
            left: 0;
            z-index: 2;
        }

        .wave-top {
            top: -10px;
            border-radius: 0 0 50% 50% / 0 0 20px 20px;
        }

        .wave-bottom {
            bottom: -10px;
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
        }

        .login-content {
            display: flex;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .login-left {
            flex: 1.2;
            padding: 60px 20px 60px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-right {
            width: 45%;
            background-image: url("https://images.unsplash.com/photo-1603706580932-6befcf7d8521?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8cGhhcm1hY3l8ZW58MHx8MHx8fDA%3D");
            background-size: cover;
            background-position: center;



        }

        .login-right img {

            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Typography & Shadows */
        .welcome-text {



            font-size: 30px;
            color: #0e0d0d;
            line-height: 1.2;
            margin-bottom: 25px;
            font-weight: bold;
            /* Welcome is Bold */
        }

        /* Italiano font for "to" */
        .welcome-text span.italiano {
            font-style: italic;
            font-size: 20px;
            font-weight: normal;
            /* "to" is not bold */
            display: inline-block;
            margin: 0 5px;
            font-family: 'Italianno';
            width: 14px;
            height: 38px;
            top: 100px;
            left: 68px;
            position: relative;      /* important for top/left to work */
    top: -18px;      
    left: 8px; 
        }




        .italiano {
            width: 14px;
            height: 38px;
            top: 117px;
            left: 68px;

            font-family: 'Italianno';



        }

        /* Bold GreenCare with Shadow */
        .brand-text {

            color: #1F9F00;
            font-weight: bold;
            font-size: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Bold GreenCare with Shadow */
        .brand-textcare {

            color: #111111;
            font-weight: bold;
            font-size: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-group {
            margin-bottom: 19px;
        }

        /* Input Fields with Shadow */
        input {
            width: 100%;
            padding: 3px 15px;
            border-radius: 57px;
            border: 1px solid #ddd;
            background: #ffffff;
            box-shadow: 0 3px 8px rgba(8, 6, 6, 0.986);
            outline: none;
            font-size: 13px;
            font-weight: 600;

        }

        /* Login Button with Fading Gradient and Shadow */
        .login-btn {
            background: linear-gradient(to right, #87EE62, rgba(135, 238, 98, 0.1));
            border: none;
            padding: 3px 35px;
            border-radius: 20px;
            color: #1a5c1a;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.945);
            margin-top: 5px;
            font-size: 14px;
            transition: 0.3s;
            margin-left: 50px;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .register-text {
            font-size: 12px;
            margin-top: 15px;
            color: #555;
        }

        .register-text a {
            color: #1F9F00;
            text-decoration: none;
            font-weight: 700;

        }
    </style>
</head>

<body>

    <div class="login-popup">
        <div class="wave wave-top"></div>

        <div class="login-content">
            <div class="login-left">
                <h1 class="welcome-text">
                    Welcome <br>
                    <span class="italiano">to</span>
                    <span class="brand-text">Green Care pharmaceuticals</span><span class="brand-textcare"></span>
                </h1>

                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="username" name="username" placeholder="Username" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <p class="register-text">Not registered? <a href="register.html">Create account.</a></p>
            </div>

            <div class="login-right">
                <img src="file:///C:/Users/ashan/Downloads/markus-winkler-pOu_UmkOG-0-unsplash.jpg"
                    alt="Pharmacy Background">
            </div>
        </div>

        <div class="wave wave-bottom"></div>
    </div>

    <script src="login.js"></script>
</body>

</html>
